name: clean-machine-qualification-012301b

on:
  push:
    branches: [qualification/clean-machine-012301b]
    paths:
      - .github/workflows/clean-machine-qualification.yml
      - qualification/clean_machine_acceptance.py
      - qualification/current_analytical_acceptance.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-machine-012301b
  cancel-in-progress: false

jobs:
  exact-release-on-fresh-macos:
    name: exact 012301b on fresh macOS ARM64
    runs-on: macos-15
    timeout-minutes: 180
    env:
      TARGET_SHA: 012301b9c1910ef4ccde5b3da5d4e4d94da60ce6
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      HF_HOME: artifacts/hf-cache
      UV_CACHE_DIR: artifacts/uv-cache
      PIP_NO_CACHE_DIR: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          path: qualifier

      - name: Checkout exact frozen release
        uses: actions/checkout@v4
        with:
          ref: 012301b9c1910ef4ccde5b3da5d4e4d94da60ce6
          fetch-depth: 0
          path: qualified

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6

      - name: Prove fresh ARM64 runner and exact checkout
        working-directory: qualified
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          sw_vers
          sysctl -n machdep.cpu.brand_string
          df -h .

      - name: Install exact locked scientific environment
        working-directory: qualified
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --python 3.12 --extra ml --extra dev --extra standalone
          .venv/bin/python -m ensurepip
          .venv/bin/python -c "from depthwizard.geometry_prior.da3_runtime_contract import verify_da3_runtime_dependencies; print('DA3 dependencies:', len(verify_da3_runtime_dependencies()))"
          git diff --exit-code -- uv.lock

      - name: Cache and verify the exact DA3 model snapshot
        working-directory: qualified
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path
          from huggingface_hub import snapshot_download

          revision = "f465978e618db8cc79c83b8bbf24964857db1875"
          expected = "7a799a7f95eb8d4c404c2ca8be3dc3276b350a417ddc4420db72ba850cc0e960"
          snapshot = Path(snapshot_download(
              repo_id="depth-anything/DA3MONO-LARGE",
              revision=revision,
              allow_patterns=[".gitattributes", "README.md", "config.json", "model.safetensors"],
          ))
          checkpoint = snapshot / "model.safetensors"
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit(f"DA3 checkpoint mismatch: {digest}")
          print(f"Verified DA3 checkpoint: {digest}")
          PY

      - name: Pin and validate official DA3 source
        working-directory: qualified
        run: bash scripts/setup_da3_macos.sh

      - name: Verify release source and resolver contracts
        working-directory: qualified
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.check_release_reproducibility --strict
          .venv/bin/python scripts/verify.py
          test -z "$(git status --porcelain)"

      - name: Stage external fixtures before the offline gate
        working-directory: qualified
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from scripts.release_train_5_full_acceptance import _prepare_assets
          source, dem, reference, _ = _prepare_assets()
          for path in (source, dem, reference):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing staged fixture: {path}")
              print(path)
          PY

      - name: Build and qualify self-contained scientific sidecar
        working-directory: qualified
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.build_standalone_sidecar
          .venv/bin/python -m scripts.release_train_5_sidecar_smoke
          rm -rf artifacts/standalone/pyinstaller
          rm -rf artifacts/hf-cache
          rm -rf artifacts/uv-cache
          df -h .

      - name: Build standalone macOS application and exact DMG
        working-directory: qualified/apps/desktop
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run tauri -- build
          df -h .

      - name: Verify and install the exact DMG payload
        working-directory: qualified
        run: |
          set -euo pipefail
          DMG="apps/desktop/src-tauri/target/release/bundle/dmg/DepthWizard_0.2.0_aarch64.dmg"
          test -f "$DMG"
          ACTUAL="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          test "${#ACTUAL}" = 64
          mkdir -p artifacts/acceptance/clean-machine-dmg
          printf '%s  %s\n' "$ACTUAL" "$(basename "$DMG")" \
            > artifacts/acceptance/clean-machine-dmg/SHA256SUMS
          hdiutil verify "$DMG"
          MOUNT="${RUNNER_TEMP}/depthwizard-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          sudo rm -rf /Applications/DepthWizard.app
          sudo ditto "$MOUNT/DepthWizard.app" /Applications/DepthWizard.app
          hdiutil detach "$MOUNT"
          rm -rf apps/desktop/src-tauri/target/release/bundle/macos/DepthWizard.app
          ditto /Applications/DepthWizard.app \
            apps/desktop/src-tauri/target/release/bundle/macos/DepthWizard.app
          codesign --verify --deep --strict \
            apps/desktop/src-tauri/target/release/bundle/macos/DepthWizard.app

      - name: Reclaim duplicated bundle intermediates
        working-directory: qualified
        run: |
          set -euo pipefail
          rm -rf apps/desktop/src-tauri/resources/depthwizard-core-runtime
          rm -rf apps/desktop/src-tauri/target/release/depthwizard-core-runtime
          rm -rf apps/desktop/src-tauri/target/release/build
          rm -rf apps/desktop/src-tauri/target/release/deps
          df -h .

      - name: Run the complete workflow with non-loopback networking disabled
        working-directory: qualified
        run: |
          set -euo pipefail
          INTERFACE="$(route get default | awk '/interface:/{print $2; exit}')"
          test -n "$INTERFACE"
          restore_network() {
            sudo ifconfig "$INTERFACE" up || true
          }
          trap restore_network EXIT
          sudo ifconfig "$INTERFACE" down
          if curl --silent --show-error --max-time 5 https://example.com >/dev/null 2>&1; then
            echo "external networking remained reachable during offline qualification" >&2
            exit 1
          fi
          export DEPTHWIZARD_OFFLINE_GATE=verified_interface_down
          .venv/bin/python -m scripts.verify_problem_statement_inputs
          .venv/bin/python ../qualifier/qualification/current_analytical_acceptance.py --root .
          .venv/bin/python -m scripts.release_train_5_app_bundle_smoke
          mkdir -p artifacts/acceptance/clean-machine-consecutive
          for run in 1 2 3; do
            .venv/bin/python -m scripts.release_train_5_full_acceptance
            cp artifacts/acceptance/release-train-5-full/release-train-5-full-acceptance.json \
              "artifacts/acceptance/clean-machine-consecutive/run-${run}.json"
          done
          .venv/bin/python ../qualifier/qualification/clean_machine_acceptance.py \
            --root . \
            --dmg apps/desktop/src-tauri/target/release/bundle/dmg/DepthWizard_0.2.0_aarch64.dmg \
            --output ../qualifier/evidence/clean-machine-012301b/clean-machine-standalone.json \
            --reopen-report ../qualifier/evidence/clean-machine-012301b/relaunch-reopen.json
          restore_network
          trap - EXIT
          for attempt in {1..30}; do
            if curl --silent --max-time 5 https://api.github.com >/dev/null; then
              break
            fi
            sleep 2
          done
          # Any HTTP response proves that the interface is reachable again. GitHub may
          # legitimately answer this unauthenticated probe with 403 because hosted
          # runners share a rate-limit pool, so do not treat the HTTP status as an
          # offline-restoration failure.
          curl --silent --show-error --max-time 10 https://api.github.com >/dev/null

      - name: Collect the exact-head clean-machine evidence
        working-directory: qualified
        run: |
          set -euo pipefail
          cp artifacts/acceptance/release-train-5-full/release-train-5-full-acceptance.json \
            ../qualifier/evidence/clean-machine-012301b/release-train-5-full-acceptance.json
          cp artifacts/acceptance/release-train-5-standalone/release-train-5-app-bundle-acceptance.json \
            ../qualifier/evidence/clean-machine-012301b/release-train-5-app-bundle-acceptance.json
          cp artifacts/acceptance/release-train-5-sidecar/release-train-5-sidecar-acceptance.json \
            ../qualifier/evidence/clean-machine-012301b/release-train-5-sidecar-acceptance.json
          cp artifacts/acceptance/sih26175-input-formats/input-format-contract.json \
            ../qualifier/evidence/clean-machine-012301b/input-format-contract.json
          cp artifacts/acceptance/release-train-4-analytical/calibration_gcp_report.json \
            ../qualifier/evidence/clean-machine-012301b/calibration-gcp-report.json
          cp artifacts/acceptance/release-train-4-analytical/release-train-4-analytical-acceptance.json \
            ../qualifier/evidence/clean-machine-012301b/release-train-4-acceptance.json
          cp -R artifacts/acceptance/clean-machine-consecutive \
            ../qualifier/evidence/clean-machine-012301b/
          cp artifacts/acceptance/clean-machine-dmg/SHA256SUMS \
            ../qualifier/evidence/clean-machine-012301b/SHA256SUMS

      - name: Upload immutable clean-machine evidence
        uses: actions/upload-artifact@v4
        with:
          name: clean-machine-012301b
          path: qualifier/evidence/clean-machine-012301b
          if-no-files-found: error
          retention-days: 90

      - name: Upload the exact qualified DMG
        uses: actions/upload-artifact@v4
        with:
          name: depthwizard-qualified-dmg-012301b
          path: |
            qualified/apps/desktop/src-tauri/target/release/bundle/dmg/DepthWizard_0.2.0_aarch64.dmg
            qualifier/evidence/clean-machine-012301b/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish evidence to qualification branch
        working-directory: qualifier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/clean-machine-012301b
          git commit -m "Record clean-machine evidence for 012301b"
          git push origin HEAD:qualification/clean-machine-012301b
