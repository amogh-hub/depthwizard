name: depthwizard-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-lock-bootstrap:
    name: dependency lock bootstrap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Resolve Python lock
        run: uv lock
      - name: Resolve npm lock
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve Cargo lock
        working-directory: apps/desktop/src-tauri
        run: cargo generate-lockfile
      - name: Upload deterministic lock candidates
        uses: actions/upload-artifact@v4
        with:
          name: depthwizard-dependency-locks
          if-no-files-found: error
          retention-days: 7
          path: |
            uv.lock
            apps/desktop/package-lock.json
            apps/desktop/src-tauri/Cargo.lock

  python-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.13.0 torchvision==0.28.0
      - run: python scripts/verify.py

  desktop-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  desktop-rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Create compile-only scientific runtime resource stub
        run: python3 ../../../scripts/ensure_tauri_sidecar_stub.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
