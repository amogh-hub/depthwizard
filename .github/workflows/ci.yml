name: depthwizard-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-lock-integrity:
    name: dependency lock integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Verify Python lock is current
        run: uv lock --check
      - name: Verify npm lock installs exactly
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Cargo lock is current
        working-directory: apps/desktop/src-tauri
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Prove resolver inputs did not mutate
        run: git diff --exit-code -- uv.lock apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock

  python-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev --extra ml
      - run: .venv/bin/python scripts/verify.py

  desktop-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  desktop-rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Create compile-only scientific runtime resource stub
        run: python3 ../../../scripts/ensure_tauri_sidecar_stub.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
