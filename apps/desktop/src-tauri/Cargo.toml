[package]
name = "depthwizard-desktop"
version = "0.2.0"
description = "DepthWizard standalone scientific geospatial workstation"
authors = ["DepthWizard Team"]
edition = "2021"

[lib]
name = "depthwizard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
