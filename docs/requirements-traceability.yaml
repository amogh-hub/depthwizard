requirements:
  - id: PS-INPUT-001
    clause: "Transform single-view optical RGB remote-sensing imagery"
    implementation:
      - depthwizard.io.raster.read_rgb
      - depthwizard.preprocess.stats
      - depthwizard.pipeline.geometry
    verification: "RGB ingest + tiled geometry integration tests"
    evidence: "input_compatibility_report.json"

  - id: PS-RDSM-001
    clause: "Non-georeferenced PNG/JPG imagery produces a Relative Digital Surface Model (rDSM)"
    implementation:
      - depthwizard.contracts.InputKind
      - depthwizard.io.raster.write_relative_tiff
    verification: "absence of CRS/transform preserves relative-only output and relative-unit tags"
    evidence: "rdsm_export_test.json"

  - id: PS-DSM-001
    clause: "Georeferenced imagery produces an absolute DSM with metric height values"
    implementation:
      - depthwizard.calibration.evidence
      - depthwizard.calibration.gcp
      - depthwizard.io.raster.write_float_geotiff
    verification: "metric calibration + CRS/transform preserving GeoTIFF tests"
    evidence: "dsm_export_test.json"

  - id: PS-BACKBONE-001
    clause: "Use a robust pre-trained monocular depth-estimation backbone"
    implementation:
      - depthwizard.geometry_prior.base
      - depthwizard.geometry_prior.da3.DA3MonocularPrior
      - model-manifests/da3mono-large.yaml
    verification: "exact Hugging Face revision/checkpoint identity + pinned upstream source + accelerator-specific inference integration suite"
    evidence: "backbone_manifest.json"

  - id: PS-DOMAINGAP-001
    clause: "Address remote-sensing domain gaps and structural variation"
    implementation:
      - remote-sensing refinement research lane with evidence-gated promotion policy
      - sensor/GSD-aware dataset registry and cross-sensor holdout policy
      - geodetic evidence calibration that preserves fine monocular structure
      - research-only depthwizard.height_model.terrain_structure terrain/above-ground decomposition
      - auditable depthwizard.height_model.terrain_structure_targets supervision preparation
      - fail-closed depthwizard.height_model.terrain_structure_split historical participant-supervision boundary
      - predeclared potsdam-tsd-urban-spatial-v1 train/dev split with blind-neighbour and train/dev buffer tiles withheld before raster-content inspection
      - qualification.plan_tsd_potsdam_acquisition metadata-only active-component acquisition planning
    verification: "same-input baseline comparison + cross-sensor/terrain generalization benchmark + compensation/compression regression tests + split/buffer partition tests + negative-result record; TSD remains non-production until frozen promotion gates pass"
    evidence: "domain_generalization_report.json"

  - id: PS-CAL-DEM-001
    clause: "Use lower-resolution DEM evidence such as SRTM to map scale-agnostic depth to metric elevation"
    implementation:
      - depthwizard.io.raster.reproject_to_match
      - depthwizard.io.raster.ground_sample_distance_m
      - depthwizard.calibration.evidence.calibrate_relative_height_with_dem
      - depthwizard.pipeline.runtime.ProductionElevationRuntime
    verification: "coarse-DEM spatial-frequency/support test + geodesic-GSD contract + fail-closed missing-support test + calibration residual benchmark"
    evidence: "calibration_dem_report.json"

  - id: PS-CAL-GCP-001
    clause: "Support a limited set of Ground Control Points for absolute metric calibration"
    implementation:
      - depthwizard.calibration.gcp.calibrate_relative_height_with_gcps
      - depthwizard.calibration.gcp_io.inspect_ground_control_point_file
      - depthwizard.pipeline.runtime.ProductionElevationRuntime
      - desktop GCP-only and DEM+GCP evidence workflows
    verification: "world-coordinate GCP sampling, scale/offset recovery, CSV SHA identity, post-inspection mutation rejection and DEM+GCP fusion tests"
    evidence: "calibration_gcp_report.json"

  - id: PS-CAL-SEM-001
    clause: "Scale calibration may use semantic priors, uncertainty/reliability evidence and scene-level statistics"
    implementation:
      - depthwizard.calibration.evidence.build_anchor_weights
      - depthwizard.calibration.confidence.model_confidence_to_uncertainty
      - depthwizard.pipeline.runtime.ProductionElevationRuntime confidence-aware DEM calibration
    verification: "native-confidence monotonic weighting tests + degenerate-confidence fallback + final reliability ablation"
    evidence: "semantic_calibration_ablation.json"

  - id: PS-TILING-001
    clause: "High-precision elevation output must remain usable on operational remote-sensing scenes"
    implementation:
      - depthwizard.tiling.grid
      - depthwizard.tiling.blend
      - depthwizard.pipeline.geometry overlap harmonization
      - depthwizard.evaluation.seams.evaluate_tiling_seams
    verification: "large-scene overlap/scale-drift tests + seam-to-interior discontinuity metric"
    evidence: "tiling_consistency_report.json"

  - id: PS-3D-001
    clause: "Project the original optical image onto a generated 3D terrain mesh"
    implementation:
      - depthwizard.mesh.terrain
      - apps/desktop TerrainViewport GLB rendering path
    verification: "upward-normal metric mesh + UV export tests + projection-registration QA"
    evidence: "projection_accuracy_report.json"

  - id: PS-NAV-001
    clause: "Support seamless first-person navigation and arbitrary aerial perspectives"
    implementation:
      - apps/desktop TerrainViewport Orbit/Fly/FirstPerson/TopDown controls
      - terrain-aware first-person clearance and scene-bound navigation constraints
    verification: "interaction acceptance + FPS/latency benchmark on finale hardware"
    evidence: "3d_navigation_benchmark.json"

  - id: PS-HEIGHT-001
    clause: "Analysis of structural heights"
    implementation:
      - depthwizard.analysis.structures.estimate_structure_height
      - depthwizard.analysis.project_structure.estimate_project_structure_height
      - physical-GSD roof inset plus metre-defined 1.5-8.0 m surrounding-ground support
      - robust local-ground plane fitting with inlier fraction, sector coverage and dispersion diagnostics
      - depthwizard.evaluation.building_height reference-selected per-building benchmark and material promotion gate
      - research-only terrain/AGL decomposition with independent roof, ground, AGL, signed-bias and height-stratified supervision
      - depthwizard.service project structure-height endpoint
      - desktop Structures workflow in registered 2D and evidence-native 3D
    verification: "5 cm edge-contamination and physical-scale invariance regressions + explicit-footprint integration + reference-selected per-building height/top/ground benchmark + compensation-resistant promotion tests + human-visible exposed operator gate"
    evidence: "structural_height_validation.json"

  - id: PS-SLOPE-001
    clause: "Analysis of slopes"
    implementation:
      - depthwizard.evaluation.metrics.slope_degrees
      - depthwizard.evaluation.project_analysis subpixel transects
      - depthwizard.evaluation.project_validation geodesic-grid slope validation
      - depthwizard.evaluation.report legacy geodesic-grid validation
      - desktop slope/measure/profile tools with local-ground/geodesic distances
    verification: "analytic planar-slope tests + Web-Mercator geodesic-distance regression + reference slope comparison"
    evidence: "slope_validation.json"

  - id: PS-METRICS-001
    clause: "Evaluate DSM using RMSE, MAE and correlation against LiDAR/reference data"
    implementation:
      - depthwizard.evaluation.metrics
      - depthwizard.evaluation.project_validation
    verification: "deterministic metrics tests + exact-grid/reprojected geospatial reference validation"
    evidence: "metrics.json"

  - id: PS-TERRAIN-001
    clause: "Demonstrate performance stability across urban, sparse, hilly and forested landscapes"
    implementation:
      - depthwizard.data.registry terrain labels and geographic split controls
      - depthwizard.evaluation.topography reference-defined slope-stratified terrain metrics
      - research-only terrain expert supervision in depthwizard.height_model.terrain_structure_loss
    verification: "geographically disjoint four-terrain benchmark + reference slope strata <15, 15-30, 30-45 and >=45 degrees + >=30-degree steep-terrain elevation/slope promotion gate with per-stratum non-regression"
    evidence: "terrain_breakdown.csv"

  - id: PS-VIS-001
    clause: "Rendering quality, projection accuracy and visual fidelity"
    implementation:
      - textured metric GLB/LOD exporter
      - Three.js renderer with scientific workstation design system
      - validated analytical overlays with source texture fallback
      - display-only hillshade and contour derivatives from persisted project surfaces
    verification: "projection tests, renderer/overlay recovery QA, derived-preview contract and LOD/FPS benchmark"
    evidence: "rendering_quality_report.json"

  - id: PS-UX-001
    clause: "Interface intuitiveness and navigability"
    implementation:
      - DepthWizard scientific/geospatial workstation design system
      - contextual inspector, restrained controls, explicit scientific semantics and visible deterministic workflow state
    verification: "task-based analyst usability protocol"
    evidence: "ux_acceptance_report.md"

  - id: PS-REF-001
    clause: "Allow users to validate estimated height values against reference datasets"
    implementation:
      - depthwizard.evaluation.project_validation.validate_project_reference
      - aligned reference, residual raster and metrics artifacts
      - synchronized desktop prediction/reference comparison workspace
    verification: "reference reprojection + residual/metrics integration tests"
    evidence: "reference_validation_report.json"

  - id: PS-EXPORT-001
    clause: "Output a high-fidelity DSM in a standard geospatial format"
    implementation:
      - GeoTIFF/float32 export with CRS, transform, NoData and product tags
      - immutable artifact SHA identities and hash-audited project export bundle
    verification: "round-trip GeoTIFF metadata + persisted-artifact integrity tests"
    evidence: "geospatial_export_report.json"

  - id: PS-STANDALONE-001
    clause: "Successful standalone deployment as a unified software suite"
    implementation:
      - Tauri desktop application
      - packaged loopback Python scientific sidecar with per-session authentication
      - independent 256-bit boot nonce proving the expected child process before runtime acceptance
      - offline-after-model-install operation and owned lifecycle
    verification: "identity-bound packaged boot + lifecycle/process/validate/mesh/export acceptance + final clean-machine test"
    evidence: "standalone_acceptance_report.md"

  - id: PS-STABILITY-001
    clause: "Software stability"
    implementation:
      - typed contracts, bounded tiling, fail-closed errors, provenance and immutable project manifests
      - authenticated standalone runtime recovery path
      - CI/unit/integration test suite
    verification: "2-hour scripted soak test + malformed raster/error-recovery suite"
    evidence: "software_stability_report.json"

  - id: PS-DOCS-001
    clause: "Complete source code and technical documentation"
    implementation:
      - monorepo + MASTER_SPEC + ADRs + traceability + API/user/deployment docs
      - pinned DA3 model/source identity and explicit claim boundaries
      - exact npm top-level versions plus npm/Cargo/Python lock audit contract
    verification: "reproducibility dry run from clean environment + three-surface release-lock audit"
    evidence: "reproducibility_report.md"
